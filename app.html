<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini RPG Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a1a;
            color: white;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #game-world {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70%;
            background-color: #2d2d2d;
            overflow: hidden;
        }

        #player {
            position: absolute;
            width: 32px;
            height: 32px;
            background-color: #4CAF50;
            border-radius: 50%;
            border: 2px solid #388E3C;
            z-index: 10;
            transition: transform 0.1s ease;
        }

        .tree {
            position: absolute;
            width: 40px;
            height: 60px;
            background-color: #2E7D32;
            border-radius: 20px 20px 0 0;
        }

        .rock {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #616161;
            border-radius: 50%;
        }

        #ui-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        #stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .stat {
            display: flex;
            align-items: center;
            margin-right: 15px;
        }

        .stat-icon {
            width: 20px;
            height: 20px;
            margin-right: 5px;
            border-radius: 50%;
        }

        #health .stat-icon { background-color: #f44336; }
        #hunger .stat-icon { background-color: #FF9800; }
        #energy .stat-icon { background-color: #2196F3; }
        #level .stat-icon { background-color: #9C27B0; }

        #joystick-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin-left: 20px;
        }

        #joystick-base {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(100, 100, 100, 0.5);
            border-radius: 50%;
        }

        #joystick-handle {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: rgba(33, 150, 243, 0.8);
            border-radius: 50%;
            top: 30px;
            left: 30px;
            transition: transform 0.1s ease;
        }

        #action-buttons {
            position: absolute;
            right: 20px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: rgba(76, 175, 80, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            border: none;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        #inventory {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: auto;
